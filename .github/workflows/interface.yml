name: Check local interface and static explorer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:showcase
      - run: npm test
      - run: node scripts/verify-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-browser-results
          path: apps/workbench/output/
          retention-days: 7
